<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arbeitszeit</title>
  <meta name="theme-color" content="#f8f9ff">
  <meta name="description" content="Arbeitszeit erfassen, Saldo und Urlaub im Blick">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Arbeitszeit</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="navbar" aria-label="Hauptnavigation">
    <button data-nav="day" class="nav-item">
      <span class="nav-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7Z"/></svg></span>
      <span>Tag</span>
    </button>
    <button data-nav="overview" class="nav-item">
      <span class="nav-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.2h3V19H5V9.2ZM10.6 5h2.8v14h-2.8V5Zm5.6 8H19v6h-2.8v-6Z"/></svg></span>
      <span>Übersicht</span>
    </button>
    <button data-nav="settings" class="nav-item">
      <span class="nav-ind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.8ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg></span>
      <span>Einstellungen</span>
    </button>
  </nav>

  <div id="snackbar" role="status"></div>
  <dialog id="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
